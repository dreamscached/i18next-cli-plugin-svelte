name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish_npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          cache: yarn
          node-version: "24.x"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish package
        run: yarn npm publish --access public
